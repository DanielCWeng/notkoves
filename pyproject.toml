[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notkoves"
version = "0.1.0"
description = "Local, transparent facial measurement from front-facing photos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Weng" }]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
notkoves = "notkoves.cli:main"

[tool.setuptools]
packages = ["notkoves"]

[tool.setuptools.package-data]
notkoves = ["data/*"]
